project:
  type: book

# 全域 knitr 設定
knitr:
  opts_chunk:
    message: false
    warning: false
    fig.showtext: true

# 執行設定
execute:
  echo: true
  freeze: auto

book:
  title: "R 語言統計工具入門：用 AI 學會做臨床研究統計"
  author: "林協霆"
  date: "2025/12/05"
  chapters:
    - index.qmd
    - part1.qmd
    - part2.qmd
    - part3.qmd
    - part4.qmd
    - part5.qmd
    - part6.qmd
    - appendix.qmd

bibliography: references.bib
csl: american-medical-association.csl

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: false
    code-tools: true
  pdf:
    documentclass: scrreprt
    lang: zh-TW
